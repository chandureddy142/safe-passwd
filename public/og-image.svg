<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0B0F17"/>
  
  <!-- Subtle Grid Overlay -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#10B981" opacity="0.15"/>
    </pattern>
    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="600" cy="315" r="300" fill="#10B981" opacity="0.05" filter="url(#glow)"/>

  <!-- Card Backdrop -->
  <rect x="150" y="115" width="900" height="400" rx="24" fill="#111827" stroke="#1F2937" stroke-width="2"/>

  <!-- Shield Icon -->
  <g transform="translate(550, 165)">
    <path d="M50 0L93.3013 25V75L50 100L6.69873 75V25L50 0Z" fill="url(#shield-grad)"/>
    <path d="M35 50L45 60L65 40" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main Title -->
  <text x="600" y="330" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="800" font-size="52" letter-spacing="-1">
    Safe Passwd
  </text>

  <!-- Tagline -->
  <text x="600" y="385" text-anchor="middle" fill="#9CA3AF" font-family="system-ui, sans-serif" font-weight="500" font-size="24">
    Real-time Password Strength &amp; Data Breach Exposure Detector
  </text>

  <!-- Security Badges -->
  <g transform="translate(360, 435)">
    <rect x="0" y="0" width="220" height="36" rx="18" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="110" y="23" text-anchor="middle" fill="#10B981" font-family="monospace" font-weight="700" font-size="14">
      100% Client-Side
    </text>

    <rect x="260" y="0" width="220" height="36" rx="18" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.3"/>
    <text x="370" y="23" text-anchor="middle" fill="#10B981" font-family="monospace" font-weight="700" font-size="14">
      k-Anonymity HIBP API
    </text>
  </g>
</svg>
